name: subc2c-nas

services:
  app:
    image: subc2c:nas
    container_name: subc2c-nas-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${SUBC2C_DATA_ROOT:-/share/CACHEDEV1_DATA/Container/subc2c}/app:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: subc2c
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: subc2c
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@subc2c.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [internal]

  postgres:
    image: postgres:18-alpine
    container_name: subc2c-nas-postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: subc2c
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: subc2c
      TZ: Asia/Shanghai
    volumes:
      - ${SUBC2C_DATA_ROOT:-/share/CACHEDEV1_DATA/Container/subc2c}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subc2c -d subc2c"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8-alpine
    container_name: subc2c-nas-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - ${SUBC2C_DATA_ROOT:-/share/CACHEDEV1_DATA/Container/subc2c}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  bootstrap:
    image: postgres:18-alpine
    container_name: subc2c-nas-bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        psql -h postgres -U subc2c -d subc2c -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO settings (key, value, updated_at)
        VALUES
          ('registration_enabled', 'true', NOW()),
          ('invitation_code_enabled', 'true', NOW()),
          ('email_verify_enabled', 'false', NOW()),
          ('site_name', 'TokenC2C', NOW()),
          ('site_subtitle', '共享 Token 账户池', NOW())
        ON CONFLICT (key) DO UPDATE
        SET value = EXCLUDED.value, updated_at = NOW();
        SQL
    networks: [internal]

networks:
  internal:
    name: subc2c-nas-internal
